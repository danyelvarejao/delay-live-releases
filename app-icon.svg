<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Delay Live</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d7bff"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dot" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff7a8f"/>
      <stop offset="1" stop-color="#ff2d55"/>
    </radialGradient>
  </defs>

  <!-- Fundo -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#shine)"/>

  <!-- Seta circular no sentido anti-horário: "voltar no tempo" -->
  <path d="M 642 307 A 260 260 0 1 1 382 307" fill="none" stroke="#ffffff" stroke-width="72" stroke-linecap="round"/>
  <polygon points="548,250 712,244 628,396" fill="#ffffff" stroke="#ffffff" stroke-width="24" stroke-linejoin="round"/>

  <!-- Ponto "ao vivo" -->
  <circle cx="512" cy="562" r="104" fill="#ff2d55" opacity="0.35"/>
  <circle cx="512" cy="562" r="86" fill="url(#dot)"/>
</svg>
